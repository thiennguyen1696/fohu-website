    <script>
        const hotArticles = [
            {
                id: 1,
                tag: "Máy ảnh",
                title: "Đánh giá chi tiết Sony A7V: Kỷ nguyên AI Autofocus thế hệ mới trong nhiếp ảnh thương mại",
                desc: "Phân tích chuyên sâu những nâng cấp đột phá về cảm biến, chip xử lý thần kinh và khả năng lấy nét chớp nhoáng.",
                img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=800&q=80",
                date: "Hôm nay • 6 phút đọc",
                content: `Sony vừa chính thức thiết lập một tiêu chuẩn hoàn toàn mới trong phân khúc máy ảnh mirrorless full-frame chuyên nghiệp với sự ra mắt của Sony A7V. Không chỉ đơn thuần là bản nâng cấp vòng đời, chiếc máy ảnh này mang trong mình cuộc cách mạng thực sự về công nghệ trí tuệ nhân tạo áp dụng trực tiếp vào hệ thống lấy nét và xử lý hình ảnh.\n\n1. Sức mạnh vượt trội từ bộ xử lý AI thế hệ thứ hai\nKhác với các dòng máy tiền nhiệm, Sony A7V được trang bị một con chip chuyên biệt dành riêng cho việc học máy (Machine Learning). Chip này có khả năng nhận diện cấu trúc cơ thể người, chuyển động của động vật, côn trùng, xe cộ và thậm chí là dự đoán hướng di chuyển của chủ thể ngay cả khi bị che khuất hoàn toàn trong một khoảnh khắc ngắn.\n\n2. Hiệu suất quang học và cảm biến BSI-CMOS mới\nSở hữu cảm biến 33MP với công nghệ chiếu sáng sau (BSI), A7V mang lại dải tương phản động (Dynamic Range) lên tới 15 stops. Điều này giúp các nhiếp ảnh gia thương mại và dịch vụ cưới dễ dàng kéo chi tiết vùng tối (shadows) và bảo vệ vùng sáng (highlights) mà không lo bị nhiễu hạt hay bệt màu.\n\n3. Trải nghiệm thực tế và khả năng quay video\nBên cạnh chụp ảnh tĩnh xuất sắc, máy hỗ trợ quay phim độ phân giải 4K 60p Oversampling từ vùng cảm biến 7K, mang lại độ nét hoàn hảo. Hệ thống tản nhiệt mới cũng giúp máy hoạt động bền bỉ trong các buổi quay sự kiện kéo dài liên tục mà không gặp tình trạng quá nhiệt.`
            },
            {
                id: 2,
                tag: "Thủ thuật",
                title: "Bí quyết set up ánh sáng 3 điểm chuyên nghiệp cho Studio diện tích nhỏ tại nhà",
                desc: "Hướng dẫn tối ưu không gian hẹp nhưng vẫn tạo ra những thước phim cinematic có chiều sâu nghệ thuật.",
                img: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=800&q=80",
                date: "Hôm nay • 5 phút đọc",
                content: `Việc sở hữu một không gian studio nhỏ hẹp tại nhà không còn là rào cản lớn đối với các nhà sáng tạo nội dung nếu bạn nắm vững nguyên lý thiết lập ánh sáng 3 điểm (Three-Point Lighting) tối ưu.\n\n1. Định vị đèn chính (Key Light)\nĐèn chính nên được đặt lệch góc từ 45 đến 60 độ so với chủ thể. Để ánh sáng không bị gắt và tạo bóng đổ quá cứng, hãy sử dụng một softbox cầu (Lantern Softbox) có đường kính từ 65cm trở lên. Ánh sáng tản đều sẽ giúp làn da mịn màng tự nhiên.\n\n2. Xử lý ánh sáng bổ trợ (Fill Light)\nTrong phòng nhỏ, ánh sáng từ đèn chính thường sẽ dội ngược lại các bức tường trắng. Tuy nhiên, để kiểm soát vùng tối bên còn lại của khuôn mặt, bạn nên dùng một tấm hắt sáng màu trắng hoặc một đèn LED panel phụ đánh công suất nhỏ để cân bằng sáng tối.\n\n3. Tạo điểm nhấn với Rim Light (Đèn viền)\nĐây là chìa khóa quan trọng nhất giúp tách biệt chủ thể ra khỏi phông nền tối, mang lại cảm giác không gian ba chiều vô cùng cao cấp. Đặt đèn chiếu thẳng vào sau gáy chủ thể, kết hợp gel màu cam hoặc xanh dương nhẹ để tăng tính thẩm mỹ cho video.`
            },
            {
                id: 3,
                tag: "Edit Video",
                title: "Top 5 hiệu ứng chuyển cảnh và âm thanh giúp giữ chân người xem TikTok/Reels trên 70%",
                desc: "Khám phá các kỹ thuật dựng phim ngắn tối ưu hóa thuật toán phân phối video của các nền tảng mạng xã hội.",
                img: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=800&q=80",
                date: "Hôm nay • 7 phút đọc",
                content: `Tỷ lệ giữ chân người xem (Retention Rate) chính là yếu tố quyết định sự thành bại của một video ngắn dạng dọc trên các nền tảng như TikTok, Instagram Reels hay YouTube Shorts.\n\n1. Kỹ thuật Match Cut và Whip Pan\nChuyển cảnh bằng cách hất máy tốc độ cao kết hợp đồng bộ nhịp điệu hành động của nhân vật giúp não bộ người xem không bị ngắt quãng nhịp thị giác.\n\n2. Sức mạnh của Sound Design (Thiết kế âm thanh)\nMỗi lần chuyển cảnh hoặc xuất hiện một chữ text quan trọng, hãy lồng ghép các hiệu ứng âm thanh như whoosh, hit, riser. Âm thanh kích thích thính giác sẽ giữ chân người xem ở lại lâu hơn gấp đôi so với chỉ dùng nhạc nền đơn thuần.\n\n3. Nhịp độ cắt dựng (Pacing)\nCứ sau từ 2 đến 3 giây, khung hình bắt buộc phải có sự thay đổi về góc quay, zoom in/out hoặc chèn B-roll minh họa để xóa bỏ hoàn toàn cảm giác nhàm chán.`
            },
            {
                id: 4,
                tag: "Máy quay",
                title: "So sánh chi tiết DJI Osmo Pocket 4 Pro và Sony ZV-E10 II: Đâu là lựa chọn tối ưu cho Vlogger?",
                desc: "Phân tích ưu nhược điểm giữa sự nhỏ gọn bỏ túi tuyệt đối và sức mạnh của cảm biến lớn thay đổi ống kính.",
                img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=800&q=80",
                date: "Hôm nay • 8 phút đọc",
                content: `Cuộc cạnh tranh trong phân khúc máy quay vlog luôn vô cùng khốc liệt giữa các dòng máy tích hợp chống rung cơ học và máy ảnh mirrorless truyền thống.\n\n1. DJI Osmo Pocket 4 Pro: Tiện lợi và Linh hoạt\nSở hữu gimbal chống rung cơ học 3 trục tích hợp sẵn, chiếc máy này có thể khởi động và sẵn sàng quay phim chỉ trong vòng chưa đầy 1 giây. Thiết kế siêu nhỏ gọn giúp bạn dễ dàng quay vlog đường phố mà không gây chú ý.\n\n2. Sony ZV-E10 II: Sức mạnh điện ảnh và Xóa phông\nVới cảm biến APS-C lớn, thiết bị này cho phép bạn thay đổi ống kính linh hoạt, tạo ra hiệu ứng xóa phông mờ mịt cực kỳ nghệ thuật và khả năng quay thiếu sáng vượt trội hơn hẳn các dòng máy bỏ túi cảm biến nhỏ.\n\n3. Lời khuyên lựa chọn\nNếu bạn chuyên làm vlog du lịch, đi bộ nhiều và cần sự gọn nhẹ tối đa, hãy chọn Pocket 4 Pro. Ngược lại, nếu bạn làm nội dung phỏng vấn studio, review sản phẩm cần chất lượng hình ảnh cao cấp, ZV-E10 II là sự đầu tư hoàn hảo.`
            },
            {
                id: 5,
                tag: "Chụp ảnh",
                title: "Nghệ thuật chụp ảnh ngược sáng (Backlight Photography): Làm chủ đo sáng và khóa nét",
                desc: "Hướng dẫn toàn tập cách tạo ra những bức ảnh nghệ thuật silhoutte và chân dung hoàng hôn rực rỡ không bị tối mặt.",
                img: "https://images.unsplash.com/photo-1500634245200-e524fc6753fa?w=800&q=80",
                date: "Hôm nay • 6 phút đọc",
                content: `Chụp ảnh ngược sáng luôn mang lại hiệu ứng thị giác mạnh mẽ nhưng đồng thời cũng là thử thách lớn đối với các nhiếp ảnh gia do hiện tượng lóa sáng (flare) và mất chi tiết vùng tối.\n\n1. Thiết lập chế độ đo sáng điểm (Spot Metering)\nThay vì sử dụng đo sáng toàn khung hình khiến máy ảnh tự động cân bằng và làm tối đen chủ thể, hãy chuyển sang chế độ Spot Metering và đo sáng trực tiếp vào phần da sáng của nhân vật hoặc rìa ánh sáng rực rỡ.\n\n2. Kiểm soát hiện tượng Lens Flare\nSử dụng hood chống chói hoặc khéo léo để một phần thân cây, mái nhà che bớt một phần nguồn sáng trực tiếp chiếu vào thấu kính sẽ giúp bức ảnh giữ được độ tương phản cao, tránh bị mờ sương.\n\n3. Xử lý hậu kỳ thông minh\nKhi chụp định dạng RAW, bạn có thể dễ dàng kéo chi tiết vùng bóng râm (shadows) lên mà không lo bị nhiễu hạt nặng nhờ vào dải tần nhạy sáng của các dòng máy ảnh hiện đại.`
            },
            {
                id: 6,
                tag: "Color Grading",
                title: "Công thức giả lập màu phim Film Look cổ điển chuẩn Kodak & Fujifilm cho Editor",
                desc: "Bí quyết tinh chỉnh thông số màu sắc, đường cong Tone Curve và hạt film để mang lại chất liệu hoài cổ.",
                img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80",
                date: "Hôm nay • 6 phút đọc",
                content: `Màu phim analog luôn sở hữu sức hút kỳ lạ đối với người xem nhờ sự ấm áp, hoài niệm và độ sâu màu sắc đặc trưng.\n\n1. Xử lý đường cong Tone Curve\nĐể tạo ra chất màu phim kinh điển, hãy nâng nhẹ điểm đen (black point) trên biểu đồ Tone Curve lên một chút. Thao tác này tạo ra hiệu ứng phủ sương mờ (matte look) rất được ưa chuộng trong các video lifestyle hiện đại.\n\n2. Cân chỉnh kênh màu HSL\nGiảm độ bão hòa của các sắc độ màu đỏ rực, đồng thời dịch chuyển tông màu da (skin tone) hơi ngả vàng ấm để tạo cảm giác thân thiện, hoài cổ.\n\n3. Hiệu ứng Film Grain\nThêm một lớp hạt film mịn với tỷ lệ vừa phải sẽ che lấp đi cảm giác kỹ thuật số sắc lạnh của cảm biến máy ảnh, hoàn thiện vẻ đẹp hoài niệm cho thước phim.`
            },
            {
                id: 7,
                tag: "Thiết bị",
                title: "Khám phá tiêu cự 35mm: 'Vua của mọi góc nhìn' trong nhiếp ảnh đường phố và tài liệu",
                desc: "Lý do vì sao các nhiếp ảnh gia huyền thoại luôn coi ống kính 35mm là người bạn đồng hành tin cậy nhất.",

        function renderBlogList() {
            const grid = document.getElementById('blogGridContainer');
            if (!grid) return;
            let html = '';
            hotArticles.forEach(item => {
                html += `
                    <article class="blog-card" onclick="openArticle(${item.id})">
                        <div class="blog-img-box" style="background-image: url('${item.img}');">
                            <span class="blog-tag-badge">${item.tag}</span>
                        </div>
                        <div class="blog-content-body">
                            <div>
                                <h3>${item.title}</h3>
                                <p>${item.desc}</p>
                            </div>
                            <div class="blog-meta-info">
                                <i class="fa-regular fa-clock"></i> <span>${item.date}</span>
                            </div>
                        </div>
                    </article>
                `;
            });
            grid.innerHTML = html;
        }

        function openArticle(id) {
            const article = hotArticles.find(a => a.id === id);
            if (!article) return;
            document.getElementById('modalBlogTitle').innerText = article.title;
            document.getElementById('modalBlogImg').src = article.img;
            document.getElementById('modalBlogContent').innerText = article.content;
            document.getElementById('blogDetailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('blogDetailModal').classList.remove('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderBlogList();
        });
    </script>

const PRIVACY=`<div class="box doc"><h3>1. Dữ liệu chúng tôi thu thập</h3><ul><li><b>Tài khoản:</b> tên, email và ảnh đại diện từ tài khoản Google khi bạn đăng nhập.</li><li><b>Hồ sơ:</b> tên hiển thị, tên người dùng, bio, chuyên môn, số điện thoại, địa chỉ, khu vực hoạt động.</li><li><b>Nội dung:</b> ảnh, video, daily, bình luận, tin nhắn và đơn hàng bạn đăng.</li><li><b>Đối tác:</b> ảnh căn cước công dân (hai mặt), số điện thoại, địa chỉ để xác minh danh tính.</li><li><b>Giao dịch:</b> mã thanh toán, số tiền, thời gian và gói đã đăng ký. Chúng tôi không lưu mật khẩu hay số thẻ ngân hàng của bạn.</li></ul>
<h3>2. Mục đích sử dụng</h3><p>Vận hành nền tảng, hiển thị nội dung, kết nối khách hàng với đối tác, xác minh đối tác, ghi nhận thanh toán và kích hoạt gói, hỗ trợ người dùng, phòng chống gian lận và spam.</p>
<h3>3. Ai có thể thấy dữ liệu của bạn</h3><ul><li>Bài đăng và hồ sơ công khai hiển thị với người dùng đã đăng nhập.</li><li>Số điện thoại và địa chỉ trên trang cá nhân chỉ hiển thị với tài khoản đối tác.</li><li>Thông tin liên hệ trong đơn hàng chỉ hiển thị với chủ đơn và đối tác đã mở đơn đó.</li><li>Tin nhắn chỉ hiển thị với những người trong cuộc trò chuyện.</li><li>Ảnh căn cước công dân chỉ quản trị viên được phân quyền xem để xác minh, và được xóa ngay sau khi hồ sơ được duyệt hoặc từ chối.</li></ul>
<h3>4. Thời gian lưu trữ</h3><p>Daily tự xóa sau 24 giờ. Ảnh căn cước công dân bị xóa sau khi xử lý hồ sơ. Các nội dung khác được lưu đến khi bạn xóa hoặc yêu cầu xóa tài khoản.</p>
<h3>5. Nhà cung cấp hạ tầng</h3><p>Để vận hành, FOHU sử dụng dịch vụ của Google Firebase (đăng nhập, cơ sở dữ liệu), Cloudflare (lưu trữ ảnh và video), Vercel (máy chủ web) và SePay cùng ngân hàng (nhận thông báo biến động số dư khi thanh toán). Các bên này chỉ xử lý dữ liệu theo mục đích vận hành dịch vụ.</p>
<h3>6. Quyền của bạn</h3><p>Bạn có quyền truy cập, chỉnh sửa, xóa nội dung của mình, yêu cầu xóa tài khoản và dữ liệu, hoặc rút lại sự đồng ý xử lý dữ liệu. Hãy gửi yêu cầu qua mục Liên hệ trong trang Hỗ trợ.</p>
<h3>7. Bảo mật</h3><p>Dữ liệu được truyền qua kết nối mã hóa HTTPS và được phân quyền truy cập theo từng loại thông tin. Chúng tôi không bán dữ liệu cá nhân của bạn.</p>
<h3>8. Thay đổi chính sách</h3><p>Chính sách có thể được cập nhật khi dịch vụ thay đổi. Phiên bản mới có hiệu lực khi được đăng trên trang này. Cập nhật lần cuối: tháng 10/2026.</p></div>`;
const TERMS=`<div class="box doc"><h3>1. Về FOHU</h3><p>FOHU là nền tảng chia sẻ ảnh, video và kết nối khách hàng với các đối tác sáng tạo (nhiếp ảnh, quay phim, trang điểm, cho thuê trang phục và studio, AI artist, thiết kế...). FOHU chỉ là bên kết nối, không phải bên tham gia hợp đồng giữa khách hàng và đối tác. Giá cả, lịch làm việc, nghiệm thu và thanh toán do các bên tự thỏa thuận.</p>
<h3>2. Tài khoản</h3><p>Bạn đăng nhập bằng tài khoản Google, cung cấp thông tin chính xác và tự chịu trách nhiệm về hoạt động trên tài khoản của mình. Không mạo danh người khác.</p>
<h3>3. Nội dung</h3><p>Bạn giữ quyền sở hữu nội dung đăng tải và cho phép FOHU hiển thị nội dung đó để vận hành dịch vụ. Bạn cam kết có quyền đối với nội dung và không đăng nội dung vi phạm pháp luật, khiêu dâm, bạo lực, lừa đảo, spam, hoặc xâm phạm bản quyền và hình ảnh của người khác. Tài khoản Free không được đăng số điện thoại, địa chỉ trong bài để quảng cáo.</p>
<h3>4. Gói đối tác và thanh toán</h3><ul><li>Gói Standard và Premium có giá và quyền lợi niêm yết tại trang Đối tác.</li><li>Gói có hiệu lực 30 ngày kể từ khi thanh toán thành công và không tự động gia hạn. Hết hạn, tài khoản trở về gói Free.</li><li>Thanh toán bằng chuyển khoản theo mã QR, đúng số tiền và nội dung được cung cấp để hệ thống tự động ghi nhận.</li><li>Khoản đã thanh toán không được hoàn lại, trừ trường hợp lỗi từ phía hệ thống FOHU. Hãy liên hệ hỗ trợ trong vòng 7 ngày kể từ ngày thanh toán.</li></ul>
<h3>5. Đơn hàng</h3><p>Khách hàng có thể đăng đơn tìm đối tác. Thông tin liên hệ chỉ hiển thị cho đối tác đã mở đơn. Đối tác không được dùng thông tin này vào mục đích khác ngoài việc trao đổi công việc của đơn đó.</p>
<h3>6. Xác minh đối tác</h3><p>Dấu "Đã xác minh" được cấp sau khi FOHU kiểm tra giấy tờ tùy thân. FOHU có quyền từ chối hồ sơ không đạt yêu cầu.</p>
<h3>7. Xử lý vi phạm</h3><p>FOHU có thể gỡ nội dung hoặc khóa tài khoản vi phạm. Nếu cần khiếu nại, hãy gửi yêu cầu qua mục Liên hệ.</p>
<h3>8. Giới hạn trách nhiệm</h3><p>FOHU không bảo đảm chất lượng dịch vụ của đối tác hay kết quả của giao dịch giữa các bên và không chịu trách nhiệm về thiệt hại phát sinh từ giao dịch đó, trong phạm vi pháp luật cho phép.</p>
<h3>9. Thay đổi và luật áp dụng</h3><p>Điều khoản có thể được cập nhật; việc tiếp tục sử dụng dịch vụ nghĩa là bạn đồng ý với phiên bản mới. Điều khoản được điều chỉnh theo pháp luật Việt Nam. Cập nhật lần cuối: tháng 10/2026.</p></div>`;

 saveSkills:async()=>{const v=[...document.querySelectorAll('#sl input:checked')].map(i=>i.value).slice(0,3);await updateDoc(doc(db,'users',au.uid),{skills:v});closeM();toast('Đã lưu chuyên môn')},
 postOrder:()=>{const m=me||{};modal(`<h3>Đăng tìm artist</h3><label>Khu vực (tỉnh/thành)</label><select id="op">${VN.map(p=>`<option ${p===m.province?'selected':''}>${p}</option>`).join('')}</select>
  <label>Bạn cần tìm ai? (tiêu đề)</label><input id="ot" placeholder="Ví dụ: Cần photographer chụp ảnh kỷ yếu"><label>Mô tả chi tiết</label><textarea id="od" rows="3"></textarea>
  <label>Ngân sách</label><input id="ob" placeholder="Ví dụ: 3–5 triệu"><label>Ngày cần</label><input id="odt" placeholder="Ví dụ: 20/11/2026">
  <label>Họ tên liên hệ</label><input id="on" value="${E(m.name)}"><label>Số điện thoại</label><input id="oph" value="${E(m.phone)}"><label>Địa chỉ</label><input id="oa" value="${E(m.addr)}">
  <p style="font-size:12px;color:var(--mu)">Tiêu đề, tên khách hàng và khu vực được hiển thị công khai. Mô tả, số điện thoại, địa chỉ chỉ hiện khi đối tác Premium (hoặc Standard còn lượt) bấm vào đơn để xem.</p><div class="err" id="er"></div><button class="btn" style="width:100%;margin-top:12px" id="ob2" onclick="saveOrder()">Đăng đơn</button>`)},
 saveOrder:async()=>{const e=$('#er'),g=i=>$(i).value.trim(),d={title:g('#ot'),desc:g('#od'),budget:g('#ob'),date:g('#odt'),name:g('#on'),phone:g('#oph'),addr:g('#oa')};
  if(!d.title)return e.textContent='Hãy nhập tiêu đề';if(!d.name)return e.textContent='Hãy nhập họ tên liên hệ';if(!/^(0|\+84)\d{9}$/.test(d.phone.replace(/\s/g,'')))return e.textContent='Số điện thoại không hợp lệ';
  $('#ob2').disabled=true;const ref=doc(collection(db,'orders')),b=writeBatch(db);
  b.set(ref,{uid:au.uid,province:$('#op').value,status:'open',title:d.title.slice(0,120),cname:d.name.slice(0,60),applyCount:0,at:serverTimestamp()});b.set(doc(db,'orders',ref.id,'private','info'),d);
  try{await b.commit();closeM();toast('Đã đăng đơn')}catch(x){e.textContent='Lỗi: '+x.code;$('#ob2').disabled=false}},
 delOrder:async id=>{if(!confirm('Xóa đơn hàng này?'))return;const b=writeBatch(db);b.delete(doc(db,'orders',id,'private','info'));b.delete(doc(db,'orders',id));try{await b.commit();delete PV[id]}catch(x){toast('Lỗi: '+x.code)}},
 unlock:async id=>{const pl=me.plan;if(pl==='free'){toast('Cần gói đối tác để xem thông tin');return go('partner')}
  if(pl==='standard'&&used(me)>=5)return toast('Đã hết 5 lượt nhận đơn tháng này – chờ sang tháng mới hoặc nâng cấp Premium');
  if(!confirm(pl==='standard'?'Xem thông tin sẽ tính 1 lượt nhận đơn. Tiếp tục?':'Xem thông tin đơn hàng này?'))return;
  const b=writeBatch(db),u={unlocked:arrayUnion(id)};b.set(doc(db,'orders',id,'unlocks',au.uid),{uid:au.uid,at:serverTimestamp()});if(pl==='standard'){u.applied=used(me)+1;u.appliedM=mIdx()}b.update(doc(db,'users',au.uid),u);const ow=(O.find(x=>x.id===id)||{}).uid;if(ow&&ow!==au.uid)b.set(doc(collection(db,'users',ow,'notifs')),{type:'order',from:au.uid,orderId:id,read:false,at:serverTimestamp()});
  try{await b.commit();delete PVT[id];OO[id]=true;toast('Đã mở thông tin đơn hàng')}catch(x){toast('Không thể mở: '+x.code)}},
 areaP:()=>{const a=me.areas||[];modal(`<h3>Khu vực hoạt động</h3><input id="aq" placeholder="Tìm tỉnh/thành…" oninput="areaF(this.value)"><div id="al" style="max-height:50vh;overflow:auto;margin-top:8px">${VN.map(p=>`<label class="ck" data-n="${nz(p)}"><input type="checkbox" value="${p}" ${a.includes(p)?'checked':''}> ${p}</label>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" onclick="saveAreas()">Lưu</button>`)},
 areaF:v=>document.querySelectorAll('#al .ck').forEach(l=>l.style.display=l.dataset.n.includes(nz(v))?'':'none'),
 saveAreas:async()=>{const v=[...document.querySelectorAll('#al input:checked')].map(i=>i.value);await updateDoc(doc(db,'users',au.uid),{areas:v});closeM();toast('Đã lưu khu vực')},
 payQR:async k=>{const amt=k==='standard'?99000:149000;
  if(!BANK.acc)return toast('Chưa cấu hình tài khoản ngân hàng nhận tiền');
  try{PAYS=(await getDocs(query(collection(db,'payments'),where('uid','==',au.uid)))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
  const old=PAYS.find(x=>x.plan===k&&x.status==='pending'&&x.at&&x.at.toMillis&&Date.now()-x.at.toMillis()<864e5);let code=old&&old.id;
  if(!code){code=genCode();try{await setDoc(doc(db,'payments',code),{uid:au.uid,plan:k,amount:amt,status:'pending',at:serverTimestamp()})}catch(x){return toast('Không tạo được mã thanh toán: '+x.code)}}
  const note='FOHU '+code,qr=`https://img.vietqr.io/image/${encodeURIComponent(BANK.id)}-${encodeURIComponent(BANK.acc)}-compact2.png?amount=${amt}&addInfo=${encodeURIComponent(note)}&accountName=${encodeURIComponent(BANK.name)}`;
  modal(`<h3>Thanh toán gói ${PL[k]}</h3><div id="pbody" style="text-align:center"><img src="${qr}" alt="Mã QR thanh toán" style="max-width:280px;width:100%;border-radius:12px;border:1px solid var(--bd)">
  <p style="margin:10px 0 2px">Số tiền: <b>${amt.toLocaleString('vi-VN')}đ</b></p><p style="margin:0">Nội dung chuyển khoản (giữ nguyên):</p><p style="margin:4px 0 8px"><b style="font-size:18px">${note}</b></p>
  <button class="btn g" onclick="navigator.clipboard?.writeText('${note}');toast('Đã sao chép nội dung')">Sao chép nội dung</button>
  <p style="font-size:13px;color:var(--mu);margin:12px 0"><span class="ic">${AI.clock}</span>Đang chờ ngân hàng báo tiền về. Gói sẽ tự kích hoạt trong vài giây sau khi chuyển khoản thành công, bạn không cần làm gì thêm.</p><button class="btn g" style="width:100%" onclick="closeM()">Đóng</button></div>`);
  unPay();unPay=onSnapshot(doc(db,'payments',code),s=>{const d=s.data();if(d&&d.status==='paid'&&$('#pbody'))$('#pbody').innerHTML=`<div style="color:var(--act);display:flex;justify-content:center">${AI.okc}</div><h3>Thanh toán thành công!</h3><p style="color:var(--mu)">Gói ${PL[k]} đã được kích hoạt.</p><button class="btn" style="width:100%" onclick="closeM()">Hoàn tất</button>`})},
 dm:async uid=>{if(need_login())return;const id=[au.uid,uid].sort().join('_');if(!chats.find(c=>c.id===id))await setDoc(doc(db,'chats',id),{members:[au.uid,uid]});openChat(id);go('inbox')},
 openChat:id=>{unM();cid=id;msgs=[];unM=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('at')),s=>{msgs=s.docs.map(d=>d.data());draw()});draw()},
 send:async el=>{const t=el.value;el.value='';const b=writeBatch(db);b.set(doc(collection(db,'chats',cid,'messages')),{from:au.uid,t,at:serverTimestamp()});b.update(doc(db,'chats',cid),{lastFrom:au.uid,lastText:t.slice(0,80),lastAt:serverTimestamp()});await b.commit()}};
Object.assign(window,A,{fpv,zoomI,closeZ,setTh,gz,svGo,closeSV,skLim});window.addEventListener('hashchange',draw);draw();
</script></body></html>

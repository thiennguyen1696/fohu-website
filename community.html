<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tin Cộng Đồng Sáng Tạo - fohu</title>
    <meta name="description" content="Không gian kết nối, chia sẻ tác phẩm, portfolio và câu chuyện cảm hứng của cộng đồng sáng tạo Việt Nam.">
    <link rel="icon" type="image/png" href="fohu 2.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0d9488; --bg-main: #f0f2f5; --bg-card: #ffffff; --dark: #111827; --text-main: #1f2937; --text-muted: #6b7280; --border: #e2e8f0; --font-main: 'Inter', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; padding-top: 90px; }
        nav { position: fixed; top: 0; width: 100%; background: var(--bg-card); border-bottom: 1px solid var(--border); z-index: 1000; }
        .nav-container { max-width: 1440px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1.5rem; }
        .brand-logo-img { height: 52px; width: auto; object-fit: contain; cursor: pointer; }
        .nav-links { display: flex; gap: 0.3rem; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.88rem; padding: 0.4rem 0.7rem; border-radius: 999px; }
        .nav-links a:hover, .nav-links a.active { color: #fff; background: var(--dark); }
        .community-container { max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
        .post-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; margin-bottom: 1.5rem; }
        .post-box textarea { width: 100%; border: none; outline: none; resize: none; font-size: 0.98rem; min-height: 70px; background: transparent; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 0.82rem; cursor: pointer; border: none; background: var(--primary); color: #fff; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="fohu 2.png" alt="Logo" class="brand-logo-img"></a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="marketplace.html">Đối tác</a></li>
                <li><a href="community.html" class="active">Bảng tin</a></li>
                <li><a href="pricing.html">Trở thành đối tác</a></li>
                <li><a href="blog.html">Tin tức</a></li>
                <li><a href="contact.html">Liên hệ</a></li>
            </ul>
        </div>
    </nav>
    <div class="community-container">
        <h2>Bảng Tin Sáng Tạo</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Không gian chia sẻ tác phẩm của cộng đồng.</p>
        <div class="post-box">
            <textarea placeholder="Bạn có câu chuyện gì muốn chia sẻ?"></textarea>
            <div style="display: flex; justify-content: flex-end; margin-top: 10px;"><button class="btn">Đăng bài</button></div>
        </div>
    </div>
</body>
</html>
